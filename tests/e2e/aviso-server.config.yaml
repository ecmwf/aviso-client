application:
  host: "0.0.0.0"
  port: 8000
  base_url: "http://localhost:8000"  # overridden at runtime via AVISOSERVER_APPLICATION__BASE_URL to track AVISO_SERVER_HOST_PORT.
  static_files_path: "/var/empty"

watch_endpoint:
  sse_heartbeat_interval_sec: 5
  connection_max_duration_sec: 60
  replay_batch_size: 100
  max_historical_notifications: 10000
  replay_batch_delay_ms: 50
  concurrent_notification_processing: 15

notification_backend:
  kind: in_memory
  in_memory:
    max_history_per_topic: 10000
    max_topics: 100

auth:
  enabled: false

metrics:
  enabled: false

logging:
  level: info
  format: json

notification_schema:
  test_event:
    payload:
      required: false
    topic:
      base: "test"
      key_order: ["date", "time"]
    identifier:
      date:
        type: DateHandler
        canonical_format: "%Y%m%d"
        required: false
      time:
        type: TimeHandler
        required: false

  test_polygon:
    payload:
      required: true
    topic:
      base: "polygon"
      key_order: ["date", "time"]
    identifier:
      date:
        type: DateHandler
        canonical_format: "%Y%m%d"
        required: false
      time:
        type: TimeHandler
        required: false
      polygon:
        type: PolygonHandler
        required: true
