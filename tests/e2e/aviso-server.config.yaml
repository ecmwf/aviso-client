application:
  host: "0.0.0.0"
  port: 8000
  base_url: "http://localhost:8000"  # overridden at runtime via AVISOSERVER_APPLICATION__BASE_URL to track AVISO_SERVER_HOST_PORT.
  static_files_path: "/var/empty"

notification_schema_strict: true

auth:
  enabled: true
  mode: direct
  auth_o_tron_url: "http://auth-o-tron:8080"
  admin_roles:
    localrealm: ["admin"]
  timeout_ms: 5000

metrics:
  enabled: false

logging:
  level: info
  format: json

watch_endpoint:
  sse_heartbeat_interval_sec: 5
  connection_max_duration_sec: 15
  replay_batch_size: 100
  max_historical_notifications: 50
  replay_batch_delay_ms: 50
  concurrent_notification_processing: 15

notification_backend:
  kind: jetstream
  jetstream:
    nats_url: "nats://nats:4222"
    timeout_seconds: 30
    retry_attempts: 10
    max_messages: 100
    max_bytes: 10485760
    retention_time: "1h"
    storage_type: file
    replicas: 1
    retention_policy: limits
    discard_policy: old
    enable_auto_reconnect: true
    max_reconnect_attempts: 10
    reconnect_delay_ms: 1000
    publish_retry_attempts: 3
    publish_retry_base_delay_ms: 50

notification_schema:
  test_event:
    payload:
      required: false
    topic:
      base: "test"
      key_order: ["date", "time"]
    identifier:
      date:
        type: DateHandler
        canonical_format: "%Y%m%d"
        required: false
      time:
        type: TimeHandler
        required: false
    storage_policy:
      allow_duplicates: true
    auth:
      required: true
      read_roles:
        localrealm: ["*"]
      write_roles:
        localrealm: ["producer"]

  test_polygon:
    payload:
      required: true
    topic:
      base: "polygon"
      key_order: ["date", "time"]
    identifier:
      date:
        type: DateHandler
        canonical_format: "%Y%m%d"
        required: false
      time:
        type: TimeHandler
        required: false
      polygon:
        type: PolygonHandler
        required: true
    storage_policy:
      allow_duplicates: true
    auth:
      required: true
      read_roles:
        localrealm: ["*"]
      write_roles:
        localrealm: ["producer"]
