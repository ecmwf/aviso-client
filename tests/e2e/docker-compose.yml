services:
  aviso-server:
    image: eccr.ecmwf.int/aviso/aviso_server:0.6.2@sha256:2c2607d1ba4d9b4bf55e52bf9b08793d8ca1959843a3efaa3d6f6922d5fdc60c
    ports:
      - "127.0.0.1:${AVISO_SERVER_HOST_PORT:-8000}:8000"
    environment:
      RUST_LOG: "info"
      AVISOSERVER_CONFIG_FILE: "/etc/aviso/config.yaml"
      AVISOSERVER_APPLICATION__BASE_URL: "http://127.0.0.1:${AVISO_SERVER_HOST_PORT:-8000}"
    volumes:
      - "./aviso-server.config.yaml:/etc/aviso/config.yaml:ro"

