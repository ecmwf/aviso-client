services:
  aviso-server:
    build:
      context: https://github.com/ecmwf/aviso-server.git#${AVISO_SERVER_SHA}
      dockerfile: Dockerfile
    image: aviso-server:e2e-${AVISO_SERVER_SHA}
    ports:
      - "127.0.0.1:${AVISO_SERVER_HOST_PORT:-8000}:8000"
    environment:
      RUST_LOG: "info"

