[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "pyaviso"
dynamic = ["version"]
description = "Python client for aviso-server, a notification service for data-driven workflows."
readme = "python/README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES", "LICENSES/*.txt"]
authors = [
    { name = "Samet Demir", email = "samet.demir@ecmwf.int" },
    { name = "James Hawkes", email = "james.hawkes@ecmwf.int" },
    { name = "Tiago Quintino", email = "tiago.quintino@ecmwf.int" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/ecmwf/aviso-client"
Repository = "https://github.com/ecmwf/aviso-client"
Issues = "https://github.com/ecmwf/aviso-client/issues"

[project.scripts]
aviso = "pyaviso.__main__:main"

[dependency-groups]
dev = [
    "maturin>=1.15,<2",
    "ruff>=0.16",
    "ty>=0.0.81",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-httpserver>=1.1",
    "hypothesis>=6.168",
    "aiohttp>=3.14",
]

[tool.maturin]
manifest-path = "crates/aviso-py/Cargo.toml"
python-source = "python"
module-name = "pyaviso._native"
features = ["extension-module"]
# Keep the full legal material in the workspace-layout source distribution.
# license-files also installs these files into the wheel's dist-info/licenses.
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "NOTICE", format = "sdist" },
    { path = "THIRD_PARTY_NOTICES", format = "sdist" },
    { path = "LICENSES/*.txt", format = "sdist" },
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["python/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.10"
