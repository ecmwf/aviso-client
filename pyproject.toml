[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

[project]
name = "pyaviso"
dynamic = ["version"]
description = "Python client for aviso-server, a notification service for data-driven workflows."
readme = "python/README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Samet Demir", email = "samet.demir@ecmwf.int" },
    { name = "James Hawkes", email = "james.hawkes@ecmwf.int" },
    { name = "Tiago Quintino", email = "tiago.quintino@ecmwf.int" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/ecmwf/aviso-client"
Repository = "https://github.com/ecmwf/aviso-client"
Issues = "https://github.com/ecmwf/aviso-client/issues"

[project.scripts]
aviso = "pyaviso.__main__:main"

[dependency-groups]
dev = [
    "maturin>=1.13,<2",
    "ruff>=0.14",
    "ty>=0.0.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpserver>=1.1",
    "hypothesis>=6.100",
    "aiohttp>=3.10",
]

[tool.maturin]
manifest-path = "crates/aviso-py/Cargo.toml"
python-source = "python"
module-name = "pyaviso._native"
features = ["extension-module"]
# The wheel bundles the license automatically, but the workspace-layout sdist
# does not; PyPI rejects an sdist whose metadata declares License-File without
# carrying the file.
include = [{ path = "LICENSE.txt", format = "sdist" }]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["python/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.10"
