[book]
title = "aviso-client"
description = "Client suite for aviso-server, ECMWF's notification service."
authors = [
    "Samet Demir <samet.demir@ecmwf.int>",
    "James Hawkes <james.hawkes@ecmwf.int>",
    "Tiago Quintino <tiago.quintino@ecmwf.int>",
]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "rust"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/ecmwf/aviso-client"
edit-url-template = "https://github.com/ecmwf/aviso-client/edit/main/docs/{path}"
additional-js = ["mermaid.min.js", "mermaid-init.js", "theme/logo-theme.js", "theme/troubleshooting.js"]
additional-css = ["mermaid-extra.css", "theme/custom.css", "theme/troubleshooting.css", "theme/reference.css"]

[output.html.redirect]
"welcome/introduction.html" = "../index.html"
"welcome/installation.html" = "../getting-started/install.html"
"welcome/quick-start.html" = "../getting-started/quickstart.html"
"welcome/key-concepts.html" = "../getting-started/concepts.html"
"usage/cli.html" = "../cli/quickstart.html"
"usage/notify.html" = "../cli/publish-and-listen.html"
"usage/schema.html" = "../cli/operations.html"
"usage/admin.html" = "../cli/operations.html"
"usage/auth.html" = "../concepts/auth-providers.html"
"watch/overview.html" = "../concepts/streams.html"
"resume/overview.html" = "../concepts/resume-and-state.html"
"resume/state-file.html" = "../reference/state-file.html"
"troubleshooting/overview.html" = "../cli/troubleshooting.html"
"internals/architecture.html" = "../developers/architecture.html"
"internals/contributing.html" = "../developers/contributing.html"
"python/status.html" = "../python/overview.html"

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
