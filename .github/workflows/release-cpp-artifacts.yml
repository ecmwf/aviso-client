name: Release Assets

# Builds the prebuilt C/C++ binding tarballs and creates the GitHub Release
# that carries them, in one workflow on purpose: GitHub Actions has no
# cross-workflow `needs`, so creating the release elsewhere would race the
# asset upload.
#
# Each tarball is the relocatable `cargo cinstall` layout
# (include/aviso_ffi/{aviso.h,aviso.hpp}, lib/libaviso_ffi.*,
# lib/pkgconfig/aviso_ffi.pc) under a top-level
# aviso-ffi-<version>-<platform>/ directory, built, relocated, packed, and
# re-verified from the extracted tarball by scripts/package-ffi.sh. The Linux
# builds run inside the manylinux_2_28 containers so the shared library's
# glibc floor matches the wheels (and RHEL8-era consumers), which is the
# point of shipping prebuilt artifacts to users without a Rust toolchain.
#
# Recovery after a partial failure: dispatch from main with the existing tag.
# Every build checks out that tag, and the release step overwrites named assets.

on:
  push:
    # Bare semver release tags. Tag filters are globs, so this over-matches;
    # the release invariant is the strict validator.
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose assets should be rebuilt
        required: true
        type: string

concurrency:
  group: release-cpp-artifacts
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  gate:
    name: release gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
          # The invariant peels the release tag locally, so the tag refs must
          # be present even on a manual dispatch.
          fetch-depth: 0
      - name: Assert the release invariant
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REF_NAME="$RELEASE_TAG" \
            SHA="$(git rev-parse HEAD)" \
            REPO="$GITHUB_REPOSITORY" \
            bash scripts/release-invariant.sh
      - name: Check version consistency across every manifest
        run: scripts/version-consistency.sh "$RELEASE_TAG"

  linux-x86_64:
    name: linux x86_64 tarball
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Build, relocate, pack, and verify inside manylinux_2_28
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e TMPDIR=/tmp \
            -e CARGO_HOME=/tmp/cargo -e RUSTUP_HOME=/tmp/rustup \
            -e CARGO_TARGET_DIR=/tmp/target \
            -e VERSION="$RELEASE_TAG" -e PLATFORM=linux-x86_64 \
            quay.io/pypa/manylinux_2_28_x86_64 bash -euxc '
              command -v pkg-config
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y -q --profile minimal --default-toolchain none
              source "$CARGO_HOME/env"
              rustup show
              curl -fsSL https://github.com/lu-zero/cargo-c/releases/latest/download/cargo-c-x86_64-unknown-linux-musl.tar.gz \
                | tar xz -C "$CARGO_HOME/bin" cargo-cinstall
              bash scripts/package-ffi.sh "$VERSION" "$PLATFORM"
            '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffi-linux-x86_64
          path: dist-ffi
          if-no-files-found: error
          retention-days: 7

  linux-aarch64:
    name: linux aarch64 tarball
    needs: gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Build, relocate, pack, and verify inside manylinux_2_28
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e TMPDIR=/tmp \
            -e CARGO_HOME=/tmp/cargo -e RUSTUP_HOME=/tmp/rustup \
            -e CARGO_TARGET_DIR=/tmp/target \
            -e VERSION="$RELEASE_TAG" -e PLATFORM=linux-aarch64 \
            quay.io/pypa/manylinux_2_28_aarch64 bash -euxc '
              command -v pkg-config
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y -q --profile minimal --default-toolchain none
              source "$CARGO_HOME/env"
              rustup show
              curl -fsSL https://github.com/lu-zero/cargo-c/releases/latest/download/cargo-c-aarch64-unknown-linux-musl.tar.gz \
                | tar xz -C "$CARGO_HOME/bin" cargo-cinstall
              bash scripts/package-ffi.sh "$VERSION" "$PLATFORM"
            '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffi-linux-aarch64
          path: dist-ffi
          if-no-files-found: error
          retention-days: 7

  macos-arm64:
    name: macos arm64 tarball
    needs: gate
    # A numbered label, not macos-latest: the latest alias migrates under
    # release workflows otherwise.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Materialize the pinned toolchain
        run: rustup show
      - name: Install cargo-c
        # cargo-c's Rust requirement can advance beyond the workspace MSRV.
        # Build the tool with stable; package-ffi still uses the pinned cargo.
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install cargo-c --locked
      - name: Build, relocate, pack, and verify
        run: scripts/package-ffi.sh "$RELEASE_TAG" macos-arm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffi-macos-arm64
          path: dist-ffi
          if-no-files-found: error
          retention-days: 7

  macos-x86_64:
    name: macos x86_64 tarball
    needs: gate
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Materialize the pinned toolchain with the Intel target
        run: |
          rustup show
          rustup target add x86_64-apple-darwin
      - name: Install cargo-c
        # cargo-c's Rust requirement can advance beyond the workspace MSRV.
        # Build the tool with stable; package-ffi still uses the pinned cargo.
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install cargo-c --locked
      - name: Build, relocate, pack, and verify
        # Cross-compiled on the arm64 runner; the consumer smoke compiles
        # with the matching -arch and executes under Rosetta.
        env:
          TARGET: x86_64-apple-darwin
          SMOKE_CXXFLAGS: -arch x86_64
        run: scripts/package-ffi.sh "$RELEASE_TAG" macos-x86_64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffi-macos-x86_64
          path: dist-ffi
          if-no-files-found: error
          retention-days: 7

  release:
    name: github release
    needs: [gate, linux-x86_64, linux-aarch64, macos-arm64, macos-x86_64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          pattern: ffi-*
          merge-multiple: true

      - name: The asset set is exactly what a release ships
        run: |
          ls -l dist/
          for platform in linux-x86_64 linux-aarch64 macos-arm64 macos-x86_64; do
            test -f "dist/aviso-ffi-$RELEASE_TAG-$platform.tar.gz"
          done
          test "$(find dist -type f | wc -l)" -eq 4

      - name: Checksums
        run: |
          cd dist
          sha256sum aviso-ffi-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: aviso-client ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          # A pre-release tag (2.0.0-rc.1) must not present itself as the
          # latest stable release.
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          make_latest: ${{ contains(env.RELEASE_TAG, '-') && 'false' || 'true' }}
          files: |
            dist/aviso-ffi-*.tar.gz
            dist/SHA256SUMS
