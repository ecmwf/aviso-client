name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # ── Rust: fmt, clippy, build, test, doctests, lockfile ──────────
  rust:
    name: Rust
    # Trusted path only: self-hosted runners must never run fork code.
    # Fork PRs skip every trusted job; ci-pass then stays red so they
    # cannot merge. A maintainer lands the work on a repo branch to gate it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, platform-builder-docker-xl, platform-builder-Ubuntu-22.04]
    container:
      image: eccr.ecmwf.int/aviso/cli-ci:0.2.0
      credentials:
        username: ${{ secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
        password: ${{ secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
      SCCACHE_BUCKET: aviso-client-ci-cache
      SCCACHE_ENDPOINT: "https://object-store.os-api.cci1.ecmwf.int"
      SCCACHE_REGION: us-east-1
      SCCACHE_S3_USE_SSL: "true"
      SCCACHE_S3_KEY_PREFIX: aviso-client/
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      TMPDIR: ${{ github.workspace }}/.tmp
    steps:
      - uses: actions/checkout@v5
      - run: mkdir -p "$TMPDIR"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --workspace --all-targets

      - name: Test
        run: cargo test --locked --workspace --all-targets

      - name: Doctests
        run: cargo test --locked --workspace --doc

      - name: Lockfile unchanged
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code Cargo.lock

      - name: sccache stats
        if: always()
        run: sccache --show-adv-stats

      - name: Cleanup
        if: always()
        run: rm -rf "$TMPDIR" target

  # ── cargo-deny (no compile, no S3 creds) ────────────────────────
  deny:
    name: cargo-deny
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, platform-builder-docker-xl, platform-builder-Ubuntu-22.04]
    container:
      image: eccr.ecmwf.int/aviso/cli-ci:0.2.0
      credentials:
        username: ${{ secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
        password: ${{ secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: cargo-deny
        run: cargo deny --log-level warn check

  # ── mdBook docs (no S3 creds) ───────────────────────────────────
  docs:
    name: mdBook
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, platform-builder-docker-xl, platform-builder-Ubuntu-22.04]
    container:
      image: eccr.ecmwf.int/aviso/cli-ci:0.2.0
      credentials:
        username: ${{ secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
        password: ${{ secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Build docs
        run: mdbook build docs

      - name: Test docs (Rust code blocks)
        run: mdbook test docs

      - name: Cleanup
        if: always()
        run: rm -rf docs/book

  # ── Python bindings (matrix) ────────────────────────────────────
  python:
    name: Python ${{ matrix.python }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, platform-builder-docker-xl, platform-builder-Ubuntu-22.04]
    container:
      image: eccr.ecmwf.int/aviso/cli-ci:0.2.0
      credentials:
        username: ${{ secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
        password: ${{ secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
      SCCACHE_BUCKET: aviso-client-ci-cache
      SCCACHE_ENDPOINT: "https://object-store.os-api.cci1.ecmwf.int"
      SCCACHE_REGION: us-east-1
      SCCACHE_S3_USE_SSL: "true"
      SCCACHE_S3_KEY_PREFIX: aviso-client/
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      TMPDIR: ${{ github.workspace }}/.tmp
      UV_PYTHON: ${{ matrix.python }}
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
    steps:
      - uses: actions/checkout@v5
      - run: mkdir -p "$TMPDIR"

      - name: Sync environment with dev dependency group
        run: uv sync --locked --group dev

      - name: Build extension
        run: uv run maturin develop --locked

      - name: Lint
        run: uv run ruff check python/

      - name: Format check
        run: uv run ruff format --check python/

      - name: Type check
        run: uv run ty check python/

      - name: Tests
        run: uv run pytest python/tests/ -v

      - name: sccache stats
        if: always()
        run: sccache --show-adv-stats

      - name: Cleanup
        if: always()
        run: rm -rf "$TMPDIR" target .venv

  # ── e2e compose validation (GitHub-hosted; no compile, no secrets) ─
  e2e-config:
    name: e2e compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate docker-compose
        run: docker compose -f tests/e2e/docker-compose.yml config --quiet

  # ── Aggregate gate: the single required status check ────────────
  ci-pass:
    name: ci-pass
    if: always()
    needs: [rust, deny, docs, python, e2e-config]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required job succeeded
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "needs results: $results"
          case ",$results," in
            *,failure,*|*,cancelled,*|*,skipped,*)
              echo "::error::a required job did not succeed (fork PRs skip the trusted jobs by design)"
              exit 1
              ;;
          esac
          echo "all required jobs succeeded"
