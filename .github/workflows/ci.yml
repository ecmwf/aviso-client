name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup show
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --workspace --all-targets

      - name: Test
        run: cargo test --locked --workspace --all-targets

      - name: Doctests
        run: cargo test --locked --workspace --doc

      - name: Lockfile unchanged
        run: git diff --exit-code Cargo.lock

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: warn
          command: check

  docs:
    name: mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup show
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs-tools

      - name: Install mdBook (latest stable)
        run: cargo install mdbook --locked --force

      - name: Install mdbook-mermaid (latest stable)
        run: cargo install mdbook-mermaid --locked --force

      - name: Build docs
        run: mdbook build docs

      - name: Test docs (Rust code blocks)
        run: mdbook test docs

  e2e-config:
    name: e2e compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: docker compose -f tests/e2e/docker-compose.yml config --quiet

  python:
    name: Python ${{ matrix.python }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest,  python: "3.13" }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup show
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-build-${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Pin Python version for uv
        run: uv python pin ${{ matrix.python }}

      - name: Sync environment with dev dependency group
        run: uv sync --locked --group dev

      - name: Build extension
        run: uv run maturin develop --locked

      - name: Lint
        run: uv run ruff check python/

      - name: Format check
        run: uv run ruff format --check python/

      - name: Type check
        run: uv run ty check python/

      - name: Tests
        run: uv run pytest python/tests/ -v
