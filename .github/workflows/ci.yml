name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # ── Rust: fmt, clippy, build, test, doctests, lockfile ──────────
  rust:
    name: Rust
    # Trusted path only: self-hosted runners must never run fork code.
    # Fork PRs skip every trusted job; ci-pass then stays red so they
    # cannot merge. A maintainer lands the work on a repo branch to gate it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, platform-builder-docker-xl, platform-builder-Ubuntu-22.04]
    container:
      image: eccr.ecmwf.int/aviso/cli-ci:0.4.0
      credentials:
        username: ${{ secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
        password: ${{ secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
      SCCACHE_BUCKET: aviso-client-ci-cache
      SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: us-east-1
      SCCACHE_S3_USE_SSL: "true"
      SCCACHE_S3_KEY_PREFIX: aviso-client/
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      TMPDIR: ${{ github.workspace }}/.tmp
    steps:
      - name: Validate cache configuration
        run: ': "${SCCACHE_ENDPOINT:?Set the repository Actions variable SCCACHE_ENDPOINT}"'
      - uses: actions/checkout@v5
      - run: mkdir -p "$TMPDIR"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Minimum supported Rust version
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check --locked --workspace --all-targets

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --workspace --all-targets

      - name: Test
        run: cargo test --locked --workspace --all-targets

      - name: Doctests
        run: cargo test --locked --workspace --doc

      - name: Lockfile unchanged
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code Cargo.lock

      - name: sccache stats
        if: always()
        run: sccache --show-adv-stats

      - name: Cleanup
        if: always()
        run: rm -rf "$TMPDIR" target

  # ── cargo-deny (no compile, no S3 creds) ────────────────────────
  deny:
    name: cargo-deny
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, platform-builder-docker-xl, platform-builder-Ubuntu-22.04]
    container:
      image: eccr.ecmwf.int/aviso/cli-ci:0.4.0
      credentials:
        username: ${{ secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
        password: ${{ secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: cargo-deny
        run: cargo deny --log-level warn check

  # ── mdBook docs (no S3 creds) ───────────────────────────────────
  docs:
    name: mdBook
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, platform-builder-docker-xl, platform-builder-Ubuntu-22.04]
    container:
      image: eccr.ecmwf.int/aviso/cli-ci:0.4.0
      credentials:
        username: ${{ secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
        password: ${{ secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Build docs
        run: mdbook build docs

      - name: Test docs (Rust code blocks)
        run: mdbook test docs

      - name: Cleanup
        if: always()
        run: rm -rf docs/book

  # ── Python bindings (matrix) ────────────────────────────────────
  python:
    name: Python ${{ matrix.python }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, platform-builder-docker-xl, platform-builder-Ubuntu-22.04]
    container:
      image: eccr.ecmwf.int/aviso/cli-ci:0.4.0
      credentials:
        username: ${{ secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
        password: ${{ secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
      SCCACHE_BUCKET: aviso-client-ci-cache
      SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: us-east-1
      SCCACHE_S3_USE_SSL: "true"
      SCCACHE_S3_KEY_PREFIX: aviso-client/
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      TMPDIR: ${{ github.workspace }}/.tmp
      UV_PYTHON: ${{ matrix.python }}
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
    steps:
      - name: Validate cache configuration
        run: ': "${SCCACHE_ENDPOINT:?Set the repository Actions variable SCCACHE_ENDPOINT}"'
      - uses: actions/checkout@v5
      - run: mkdir -p "$TMPDIR"

      - name: Sync environment with dev dependency group
        run: uv sync --locked --group dev

      - name: Build extension
        run: uv run maturin develop --locked

      - name: Smoke-check the bundled console command
        run: uv run aviso --version

      - name: Lint
        run: uv run ruff check python/

      - name: Format check
        run: uv run ruff format --check python/

      - name: Type check
        run: uv run ty check python/

      - name: Tests
        run: uv run pytest python/tests/ -v

      - name: sccache stats
        if: always()
        run: sccache --show-adv-stats

      - name: Cleanup
        if: always()
        run: rm -rf "$TMPDIR" target .venv

  # ── e2e config + tooling (GitHub-hosted; no compile, no secrets) ─
  e2e-config:
    name: e2e config and tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate docker-compose
        run: docker compose -f tests/e2e/docker-compose.yml config --quiet
      - name: Shellcheck the stack lifecycle script
        run: shellcheck tests/e2e/shared/stack.sh tests/e2e/shared/stack.test.sh
      - name: Stack readiness unit tests
        run: bash tests/e2e/shared/stack.test.sh

  # ── Release tooling: lint and unit-test the release scripts ─────
  # GitHub-hosted with no image and no secrets; the suites mock `gh`, `cargo`,
  # and `curl`, with one exception: the packaging suite compiles a stub shared
  # library and the C++ consumer with the runner's own compiler and pkg-config.
  # Keeps the checks that gate every publisher green and trustworthy.
  release-tooling:
    name: release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shellcheck the release scripts
        run: shellcheck scripts/*.sh scripts/tests/*.test.sh
      - name: Release-invariant unit tests
        run: bash scripts/tests/release-invariant.test.sh
      - name: Version-consistency unit tests
        run: bash scripts/tests/version-consistency.test.sh
      - name: Publish-dry-run unit tests
        run: bash scripts/tests/publish-dry-run.test.sh
      - name: Publish-crates unit tests
        run: bash scripts/tests/publish-crates.test.sh
      - name: Python publisher license tests
        run: bash scripts/tests/publish-pypi.test.sh
      - name: Package-ffi unit tests
        run: bash scripts/tests/package-ffi.test.sh

  # ── FFI cargo-c install contract ────────────────────────────────
  # Proves the standard `.a/.so/.pc/.h` drop installs and that a clean consumer
  # compiles, links, and runs against it through pkg-config alone. Runs in the
  # pinned CI image, which bakes cargo-cinstall and pkg-config alongside the
  # toolchain, with sccache shared with the other compiling jobs.
  ffi-cargo-c:
    name: ffi cargo-c install
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, platform-builder-docker-xl, platform-builder-Ubuntu-22.04]
    container:
      image: eccr.ecmwf.int/aviso/cli-ci:0.4.0
      credentials:
        username: ${{ secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
        password: ${{ secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}
    defaults:
      run:
        # In a container job the runner's fallback shell is sh, which
        # rejects the `set -o pipefail` these steps rely on.
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
      SCCACHE_BUCKET: aviso-client-ci-cache
      SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: us-east-1
      SCCACHE_S3_USE_SSL: "true"
      SCCACHE_S3_KEY_PREFIX: aviso-client/
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      TMPDIR: ${{ github.workspace }}/.tmp
    steps:
      - name: Validate cache configuration
        run: ': "${SCCACHE_ENDPOINT:?Set the repository Actions variable SCCACHE_ENDPOINT}"'
      - uses: actions/checkout@v5
      - run: mkdir -p "$TMPDIR"

      - name: Install the C library to a staging prefix
        run: cargo cinstall --locked -p aviso-ffi --release --prefix="$PWD/build/ffi-prefix" --libdir="$PWD/build/ffi-prefix/lib"
      - name: Check the installed layout and pkg-config metadata
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/build/ffi-prefix/lib/pkgconfig
        run: |
          set -euo pipefail
          prefix="$PWD/build/ffi-prefix"
          for f in include/aviso_ffi/aviso.h include/aviso_ffi/aviso.hpp \
                   lib/libaviso_ffi.a lib/libaviso_ffi.so lib/pkgconfig/aviso_ffi.pc; do
            test -e "$prefix/$f" || { echo "::error::missing installed file: $f"; exit 1; }
          done
          pkg-config --exists aviso_ffi
          echo "modversion: $(pkg-config --modversion aviso_ffi)"
          echo "cflags:     $(pkg-config --cflags aviso_ffi)"
          echo "libs:       $(pkg-config --libs aviso_ffi)"
      - name: Build and run a consumer via pkg-config
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/build/ffi-prefix/lib/pkgconfig
        run: |
          set -euo pipefail
          cmake -S tests/ffi-install -B build/ffi-consumer \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build build/ffi-consumer
          # The shared lib lives in the staging prefix, not a default search
          # path, so point the runtime linker at it for the smoke run.
          LD_LIBRARY_PATH="$PWD/build/ffi-prefix/lib" ./build/ffi-consumer/smoke

      - name: sccache stats
        if: always()
        run: sccache --show-adv-stats

      - name: Cleanup
        if: always()
        run: rm -rf "$TMPDIR" target build

  # ── e2e suite: real aviso-server + auth-o-tron + NATS stack ─────
  # The host only orchestrates Docker; the suites build and run inside
  # the CI image joined to the compose network (reaching services by
  # name), which sidesteps the host toolchain and the 24.04->22.04
  # glibc gap. A required gate (in ci-pass); reconnect tests do
  # real-wire ~15-20s cycles, so timeout-minutes bounds a hung stack.
  e2e:
    name: e2e
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, platform-builder-docker-xl, platform-builder-Ubuntu-22.04]
    # As a required gate on a shared host, bound the run so a hung stack
    # fails in minutes and frees the single-flight lock below, rather
    # than holding every other PR behind it until the default timeout.
    timeout-minutes: 30
    # The stack binds fixed 127.0.0.1 ports and one compose project on
    # the shared host, so only one e2e job may run at a time repo-wide.
    concurrency:
      group: aviso-client-e2e
      cancel-in-progress: false
    env:
      COMPOSE_PROJECT_NAME: aviso-client-e2e
      COMPOSE: docker compose -f tests/e2e/docker-compose.yml
      CI_IMAGE: eccr.ecmwf.int/aviso/cli-ci:0.4.0
      # Looser readiness deadline than the 60s local default: a loaded
      # shared host can be slow to bring the stack up.
      AVISO_E2E_TIMEOUT_SECS: "120"
      SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
    steps:
      - name: Validate cache configuration
        run: ': "${SCCACHE_ENDPOINT:?Set the repository Actions variable SCCACHE_ENDPOINT}"'
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Preflight (host must orchestrate Docker)
        run: |
          # Keep registry creds in a fresh per-run dir, 0700 so the
          # config.json token is not world-readable on the shared host.
          DOCKER_CONFIG="$RUNNER_TEMP/docker-$GITHUB_RUN_ID"
          rm -rf "$DOCKER_CONFIG"
          mkdir -p "$DOCKER_CONFIG"
          chmod 700 "$DOCKER_CONFIG"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          command -v docker >/dev/null || { echo "::error::docker missing on runner host"; exit 1; }
          docker compose version >/dev/null 2>&1 || { echo "::error::docker compose plugin missing"; exit 1; }
          command -v curl >/dev/null || { echo "::error::curl missing on runner host"; exit 1; }

      - name: Log in to ECCR
        # Secrets via env, not inline: a Harbor robot username like
        # "robot$aviso" would otherwise be shell-expanded ($aviso -> "")
        # and the login would fail unauthorized.
        env:
          ECCR_USER: ${{ secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
          ECCR_TOKEN: ${{ secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}
        run: printf '%s' "$ECCR_TOKEN" | docker login eccr.ecmwf.int -u "$ECCR_USER" --password-stdin

      - name: Clear any stale stack or runner from a cancelled run
        run: |
          docker ps -aq --filter label=ci.e2e=aviso-client-e2e | xargs -r docker rm -f
          $COMPOSE down -v --remove-orphans || true

      - name: Bring the stack up (host orchestrates; polls readiness)
        run: bash tests/e2e/shared/stack.sh up

      - name: Run the e2e suites (Python, Rust, C++) in the CI image on the compose network
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          docker run --rm \
            --label ci.e2e=aviso-client-e2e \
            --network "${COMPOSE_PROJECT_NAME}_default" \
            --user "$(id -u):$(id -g)" \
            -v "$PWD":/workspace -w /workspace \
            -e HOME=/tmp -e TMPDIR=/tmp -e XDG_CACHE_HOME=/tmp/cache \
            -e CARGO_HOME=/tmp/cargo -e CARGO_TARGET_DIR=/tmp/target \
            -e SCCACHE_DIR=/tmp/sccache \
            -e UV_CACHE_DIR=/tmp/uv -e UV_PROJECT_ENVIRONMENT=/tmp/venv \
            -e CARGO_INCREMENTAL=0 \
            -e RUSTC_WRAPPER=sccache \
            -e SCCACHE_BUCKET=aviso-client-ci-cache \
            -e SCCACHE_ENDPOINT \
            -e SCCACHE_REGION=us-east-1 \
            -e SCCACHE_S3_USE_SSL=true \
            -e SCCACHE_S3_KEY_PREFIX=aviso-client/ \
            -e SCCACHE_BASEDIRS=/workspace \
            -e SCCACHE_IGNORE_SERVER_IO_ERROR=1 \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY \
            -e AVISO_E2E_EXTERNAL_STACK=1 \
            -e AVISO_E2E_BASE_URL=http://aviso-server:8000 \
            "$CI_IMAGE" \
            bash -ceux '
              uv sync --locked --group dev
              uv run maturin develop --locked
              cargo build --locked -p aviso-cli
              uv run pytest tests/e2e/python/ -v
              cargo test --locked -p aviso-e2e -- --include-ignored --test-threads=1
              cargo build --locked -p aviso-ffi
              cmake -S examples/cpp -B /tmp/build/cpp -DAVISO_FFI_LIB_DIR=/tmp/target/debug
              cmake --build /tmp/build/cpp
              BUILD_DIR=/tmp/build/cpp AVISO_BASE_URL=http://aviso-server:8000 bash tests/e2e/cpp/run_examples.sh
            '

      - name: Dump stack logs
        if: always()
        run: $COMPOSE logs --no-color > e2e-stack.log 2>&1 || true

      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: |
            e2e-stack.log
            tests/e2e/last-failure.log
          if-no-files-found: ignore

      - name: Tear down the stack
        if: always()
        run: $COMPOSE down -v --remove-orphans || true

      - name: Remove temporary docker credentials
        if: always()
        run: if [ -n "${DOCKER_CONFIG:-}" ]; then rm -rf "$DOCKER_CONFIG"; fi

  # ── C++ binding: build the C ABI, guard the header, build+run the example ─
  # Self-hosted in the CI image (which carries cmake and g++), with sccache so
  # the cargo build shares the cache with the other jobs. The example runs
  # without a server; the real-stack run lands with the prebuilt-artifact work.
  cpp:
    name: C++ binding
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, platform-builder-docker-xl, platform-builder-Ubuntu-22.04]
    container:
      image: eccr.ecmwf.int/aviso/cli-ci:0.4.0
      credentials:
        username: ${{ secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
        password: ${{ secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
      SCCACHE_BUCKET: aviso-client-ci-cache
      SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: us-east-1
      SCCACHE_S3_USE_SSL: "true"
      SCCACHE_S3_KEY_PREFIX: aviso-client/
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      TMPDIR: ${{ github.workspace }}/.tmp
    steps:
      - name: Validate cache configuration
        run: ': "${SCCACHE_ENDPOINT:?Set the repository Actions variable SCCACHE_ENDPOINT}"'
      - uses: actions/checkout@v5
      - run: mkdir -p "$TMPDIR"

      - name: Build the C ABI library
        run: cargo build --locked -p aviso-ffi

      - name: Generated C header is up to date
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cargo run --locked -p aviso-ffi --features gen-header --bin gen-header
          git diff --exit-code crates/aviso-ffi/include/aviso.h

      - name: Build and run the C++ example against the library and facade
        run: |
          cmake -S examples/cpp -B build/cpp \
            -DAVISO_FFI_LIB_DIR="$PWD/target/debug" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build build/cpp
          ./build/cpp/01_schema

      - name: sccache stats
        if: always()
        run: sccache --show-adv-stats

      - name: Cleanup
        if: always()
        run: rm -rf "$TMPDIR" target build

  # ── Aggregate gate: the single required status check ────────────
  ci-pass:
    name: ci-pass
    if: always()
    needs: [rust, deny, docs, python, e2e-config, e2e, cpp, release-tooling, ffi-cargo-c]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required job succeeded
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "needs results: $results"
          case ",$results," in
            *,failure,*|*,cancelled,*|*,skipped,*)
              echo "::error::a required job did not succeed (fork PRs skip the trusted jobs by design)"
              exit 1
              ;;
          esac
          echo "all required jobs succeeded"
