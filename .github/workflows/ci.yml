name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup show
          rustc --version

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --workspace --all-targets

      - name: Test
        run: cargo test --locked --workspace --all-targets

      - name: Doctests
        run: cargo test --locked --workspace --doc

      - name: Lockfile unchanged
        run: git diff --exit-code Cargo.lock

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: warn
          command: check

  docs:
    name: mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup show
          rustc --version

      - name: Cache cargo registry and bin
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin
          key: mdbook-${{ runner.os }}-tools-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install mdBook
        run: |
          if mdbook --version >/dev/null 2>&1; then
            echo "mdbook already installed (cache hit): $(mdbook --version)"
          else
            cargo install mdbook --locked
          fi

      - name: Install mdbook-mermaid
        run: |
          if mdbook-mermaid --version >/dev/null 2>&1; then
            echo "mdbook-mermaid already installed (cache hit): $(mdbook-mermaid --version)"
          else
            cargo install mdbook-mermaid --locked
          fi

      - name: Build docs
        run: mdbook build docs

      - name: Test docs (Rust code blocks)
        run: mdbook test docs

  e2e-config:
    name: e2e compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: docker compose -f tests/e2e/docker-compose.yml config --quiet
