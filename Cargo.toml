[workspace]
resolver = "3"
members = [
    "crates/aviso",
    "crates/aviso-cli",
    "crates/aviso-ffi",
    "crates/aviso-py",
    "crates/finesse",
    "tests/e2e/rust",
]

[workspace.package]
version = "2.2.2"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = [
    "Samet Demir <samet.demir@ecmwf.int>",
    "James Hawkes <james.hawkes@ecmwf.int>",
    "Tiago Quintino <tiago.quintino@ecmwf.int>",
]
repository = "https://github.com/ecmwf/aviso-client"
homepage = "https://github.com/ecmwf/aviso-client"
documentation = "https://github.com/ecmwf/aviso-client"

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2.2"
async-trait = "0.1"
atomicwrites = "0.4"
base64 = "0.23"
# Test-only (with http-body-util, hyper and hyper-util below): an HTTP/2
# server with a concurrent-stream limit, for the watch connection tests.
# All four are already in the tree through reqwest.
bytes = "1.12"
cbindgen = { version = "0.29", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }
fd-lock = "4.0"
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
clap_complete = { version = "4.6", default-features = false }
directories = "6.0"
finesse = { version = "2.2.2", path = "crates/finesse" }
futures-core = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
http-body-util = "0.1"
httpdate = "1.0"
humantime = "2.4"
humantime-serde = "1.1"
hyper = { version = "1.11", default-features = false }
hyper-util = { version = "0.1", default-features = false }
log = "0.4"
predicates = "3.1"
proptest = "1.11"
pyo3 = { version = "0.29", default-features = false, features = ["macros"] }
pyo3-async-runtimes = { version = "0.29", default-features = false, features = ["tokio-runtime"] }
pyo3-log = { version = "0.13", default-features = false }
pythonize = { version = "0.29", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "charset", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_jcs = "0.2"
serde_json = "1.0"
serde_norway = "0.9"
sha2 = "0.11"
static_assertions = "1.1"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", default-features = false, features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes", "log"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "ansi"] }
url = "2.5"
wiremock = "0.6"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
