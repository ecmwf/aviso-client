[workspace]
resolver = "3"
members = [
    "crates/aviso-client",
    "crates/aviso-client-cli",
    "crates/aviso-client-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
authors = ["Samet Demir <samet.demir@ecmwf.int>"]
repository = "https://github.com/ecmwf/aviso-client"
homepage = "https://github.com/ecmwf/aviso-client"
documentation = "https://github.com/ecmwf/aviso-client"

[workspace.dependencies]
# Async runtime and IO. Default features off; opt in per crate.
tokio = { version = "1.42", default-features = false }
tokio-util = { version = "0.7", default-features = false }
futures = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false }

# HTTP and TLS. rustls-tls matches aviso-server's choice.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Serialization.
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

# Error handling. Libraries use thiserror; binaries use anyhow.
thiserror = "2.0"
anyhow = "1.0"

# Observability. Libraries emit via tracing; binaries own subscriber init.
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "registry"] }

# Time. chrono matches aviso-server's serialization style.
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

# CLI parsing for the bin crate.
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
