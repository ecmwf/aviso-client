[package]
name = "aviso-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "PyO3 bindings crate for aviso, the aviso-server client library."
readme = "README.md"

[lib]
# `cdylib` for the Python extension; `rlib` so the workspace `cargo build`
# / `cargo test` can see the crate's types in cross-crate tests. Only the
# cdylib is published as a wheel.
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
aviso = { path = "../aviso", version = "=0.1.0" }
pyo3 = { workspace = true, features = ["extension-module", "abi3-py310"] }
pyo3-log = { workspace = true }
tracing = { workspace = true }
