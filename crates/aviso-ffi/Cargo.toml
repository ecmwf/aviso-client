[package]
name = "aviso-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Stable C ABI for aviso, the aviso-server client library, with a header-only C++ facade."
readme = "README.md"

[lib]
# `staticlib` and `cdylib` so a C or C++ consumer can link the prebuilt
# `libaviso_ffi.{a,so,dylib}` with its own toolchain, no Rust toolchain in its
# build. No `rlib`: this crate is consumed through its C ABI, and its Rust unit
# tests still compile because the test harness builds the crate as a test
# binary regardless of `crate-type`.
crate-type = ["staticlib", "cdylib"]

[lints]
workspace = true

[features]
# `gen-header` pulls in `cbindgen` and enables the `gen-header` binary that
# (re)writes the checked-in `include/aviso.h`. Off by default so a normal
# `cargo build` of the library never compiles `cbindgen`.
default = []
gen-header = ["dep:cbindgen"]
# Marker feature cargo-c requires to treat this crate as a C-API package. It
# adds no code; `cargo cbuild`/`cinstall` enable it to package the C ABI.
capi = []

# cargo-c packaging (https://github.com/lu-zero/cargo-c). Produces the standard
# `.a/.so/.dylib` + `.pc` + headers install layout via `cargo cinstall`. The
# committed, drift-guarded `include/aviso.h` stays the header source of truth:
# generation is off, so cargo-c installs it (and the hand-written `aviso.hpp`)
# verbatim rather than regenerating.
[package.metadata.capi.header]
generation = false
subdirectory = "aviso_ffi"

[package.metadata.capi.library]
name = "aviso_ffi"

[package.metadata.capi.pkg_config]
name = "aviso_ffi"

[package.metadata.capi.install.include]
asset = [
    { from = "include/aviso.h" },
    { from = "include/aviso.hpp" },
]

[dependencies]
aviso = { path = "../aviso", version = "=0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dependencies.cbindgen]
workspace = true
optional = true

[[bin]]
name = "gen-header"
path = "src/bin/gen_header.rs"
required-features = ["gen-header"]
