language = "C"
pragma_once = true
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "type"
include_version = false
autogen_warning = "/* Generated by cbindgen from crates/aviso-ffi. Do not edit by hand. Regenerate with `cargo run -p aviso-ffi --features gen-header --bin gen-header`. */"

[export]
# AvisoHttpMethod is no longer named in an exported function signature
# (aviso_trigger_set_method takes the discriminant as an integer to keep an
# out-of-range value from C defined rather than UB), so name it explicitly to
# keep the enum and its `AvisoHttpMethod_*` constants in the header.
include = ["AvisoHttpMethod"]

[parse]
parse_deps = false

[enum]
prefix_with_name = true
